<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>Mimo • SpeakWE</title>
  <style>
    :root{color-scheme:light;--paper:#faf7f1;--ink:#422b4e;--muted:#796b80;--accent:#78559c;--soft:#eee5f5;--border:#e5dce7}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px 18px 32px}main{width:min(100%,750px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 4px}.brand{font-size:20px;font-weight:750;letter-spacing:-.7px}.brand span{font-weight:450;color:var(--muted)}.tag{font-size:12px;font-weight:550;color:var(--accent);background:var(--soft);border-radius:999px;padding:7px 11px}
    .stage{display:grid;place-items:center}canvas{display:block;width:min(100%,600px);height:auto;aspect-ratio:6/5}.caption{text-align:center;margin:-5px 0 24px;min-height:60px}h1{font-size:22px;letter-spacing:-.5px;line-height:1.3;margin:0 0 8px;font-weight:650}.caption p{font-size:14px;line-height:1.55;color:var(--muted);margin:0}
    .expressions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button{font:inherit;color:var(--ink);font-size:13px;font-weight:550;min-height:43px;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:#fffdf9;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s,border-color .2s,transform .2s}button:hover{background:var(--soft);transform:translateY(-1px)}button:active{transform:translateY(0)}button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}button:focus-visible{outline:3px solid #bc95dd;outline-offset:3px}
    .playback{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}.playback button{font-size:12px;min-height:40px;padding:8px 12px;background:transparent;border-color:transparent;color:var(--muted)}.playback button[aria-pressed=true]{background:var(--soft);color:var(--accent)}.progress{height:3px;width:140px;max-width:70%;border-radius:2px;background:#e8dfe9;margin:20px auto 0;overflow:hidden}.progress span{display:block;height:100%;background:#b297c6;transform-origin:left;width:100%;transform:scaleX(0)}
    @media(max-width:440px){body{padding:22px 12px 26px}.brand{font-size:18px}.tag{font-size:11px}.caption{margin:0 0 18px}h1{font-size:20px}.caption p{font-size:13px}.expressions{gap:7px}button{font-size:12px;min-height:44px;padding:9px 12px}.playback{gap:4px;margin-top:14px}}
  </style>
</head>
<body>
<main>
  <header><div class="brand">Speak<span>WE</span></div><div class="tag">Mimo · Demo gerak</div></header>
  <div class="stage"><canvas id="mimo" width="1200" height="1000" role="img" aria-label="Mimo full badan: axolotl lilac berinsang peach dengan tangan, kaki, dan ekor yang bergerak."></canvas></div>
  <div class="caption" aria-live="polite" aria-atomic="true"><h1 id="state-title">Siap latihan</h1><p id="state-line">Hai! Kita latihan ngobrol, yuk.</p></div>
  <div class="expressions" role="group" aria-label="Pilih ekspresi Mimo">
    <button type="button" data-state="ready" aria-pressed="true">Siap latihan</button><button type="button" data-state="listening" aria-pressed="false">Mendengarkan</button><button type="button" data-state="speaking" aria-pressed="false">Berbicara</button><button type="button" data-state="thinking" aria-pressed="false">Berpikir</button><button type="button" data-state="encourage" aria-pressed="false">Coba lagi</button><button type="button" data-state="success" aria-pressed="false">Berhasil</button>
  </div>
  <div class="playback"><button id="auto" type="button" aria-pressed="true">Semua ekspresi otomatis</button><button id="pause" type="button" aria-pressed="false">Jeda gerak</button></div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
</main>
<script>
/* MIMO_ENGINE */
</script>
<script>
(() => {
  const canvas=document.getElementById('mimo'),renderer=MimoFullBody.create(canvas),states=MimoFullBody.states,order=Object.keys(states);
  const title=document.getElementById('state-title'),line=document.getElementById('state-line'),buttons=[...document.querySelectorAll('[data-state]')];
  const autoButton=document.getElementById('auto'),pauseButton=document.getElementById('pause'),progress=document.getElementById('progress');
  const media=window.matchMedia('(prefers-reduced-motion: reduce)');
  let state='ready',auto=!media.matches,paused=media.matches,clock=0,stateClock=0,last=performance.now(),force=false;
  function labels(){title.textContent=states[state][0];line.textContent=states[state][1];buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));autoButton.setAttribute('aria-pressed',String(auto));pauseButton.setAttribute('aria-pressed',String(paused));pauseButton.textContent=paused?'Lanjutkan gerak':'Jeda gerak';canvas.setAttribute('aria-label','Mimo full badan sedang '+states[state][0].toLowerCase()+'. '+states[state][1]);}
  function choose(next,manual=false){if(!states[next])return;state=next;stateClock=0;if(manual)auto=false;if(paused)force=true;labels();}
  buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.state,true)));
  autoButton.addEventListener('click',()=>{auto=!auto;stateClock=0;labels();});
  pauseButton.addEventListener('click',()=>{paused=!paused;last=performance.now();labels();});
  media.addEventListener('change',()=>{paused=media.matches;auto=!media.matches;force=true;labels();});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  function tick(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!document.hidden){if(!paused){clock+=dt;stateClock+=dt;if(auto&&stateClock>=6.4)choose(order[(order.indexOf(state)+1)%order.length]);renderer.render(clock,state,dt);}else if(force){renderer.render(clock,state,0,true);force=false;}progress.style.transform='scaleX('+(auto?Math.min(1,stateClock/6.4):0)+')';}requestAnimationFrame(tick);}
  labels();renderer.render(0,state,0,true);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
