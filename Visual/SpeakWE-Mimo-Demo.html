<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>Mimo • SpeakWE</title>
  <style>
    :root{color-scheme:light;--paper:#faf7f1;--ink:#422b4e;--muted:#796b80;--accent:#78559c;--soft:#eee5f5;--border:#e5dce7}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px 18px 32px}main{width:min(100%,750px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 4px}.brand{font-size:20px;font-weight:750;letter-spacing:-.7px}.brand span{font-weight:450;color:var(--muted)}.tag{font-size:12px;font-weight:550;color:var(--accent);background:var(--soft);border-radius:999px;padding:7px 11px}
    .stage{display:grid;place-items:center}canvas{display:block;width:min(100%,600px);height:auto;aspect-ratio:6/5}.caption{text-align:center;margin:-5px 0 24px;min-height:60px}h1{font-size:22px;letter-spacing:-.5px;line-height:1.3;margin:0 0 8px;font-weight:650}.caption p{font-size:14px;line-height:1.55;color:var(--muted);margin:0}
    .expressions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button{font:inherit;color:var(--ink);font-size:13px;font-weight:550;min-height:43px;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:#fffdf9;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s,border-color .2s,transform .2s}button:hover{background:var(--soft);transform:translateY(-1px)}button:active{transform:translateY(0)}button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}button:focus-visible{outline:3px solid #bc95dd;outline-offset:3px}
    .playback{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}.playback button{font-size:12px;min-height:40px;padding:8px 12px;background:transparent;border-color:transparent;color:var(--muted)}.playback button[aria-pressed=true]{background:var(--soft);color:var(--accent)}.progress{height:3px;width:140px;max-width:70%;border-radius:2px;background:#e8dfe9;margin:20px auto 0;overflow:hidden}.progress span{display:block;height:100%;background:#b297c6;transform-origin:left;width:100%;transform:scaleX(0)}
    @media(max-width:440px){body{padding:22px 12px 26px}.brand{font-size:18px}.tag{font-size:11px}.caption{margin:0 0 18px}h1{font-size:20px}.caption p{font-size:13px}.expressions{gap:7px}button{font-size:12px;min-height:44px;padding:9px 12px}.playback{gap:4px;margin-top:14px}}
  </style>
</head>
<body>
<main>
  <header><div class="brand">Speak<span>WE</span></div><div class="tag">Mimo · Demo gerak</div></header>
  <div class="stage"><canvas id="mimo" width="1200" height="1000" role="img" aria-label="Mimo full badan: axolotl lilac berinsang peach dengan tangan, kaki, dan ekor yang bergerak."></canvas></div>
  <div class="caption" aria-live="polite" aria-atomic="true"><h1 id="state-title">Siap latihan</h1><p id="state-line">Hai! Kita latihan ngobrol, yuk.</p></div>
  <div class="expressions" role="group" aria-label="Pilih ekspresi Mimo">
    <button type="button" data-state="ready" aria-pressed="true">Siap latihan</button><button type="button" data-state="listening" aria-pressed="false">Mendengarkan</button><button type="button" data-state="speaking" aria-pressed="false">Berbicara</button><button type="button" data-state="thinking" aria-pressed="false">Berpikir</button><button type="button" data-state="encourage" aria-pressed="false">Coba lagi</button><button type="button" data-state="success" aria-pressed="false">Berhasil</button>
  </div>
  <div class="playback"><button id="auto" type="button" aria-pressed="true">Semua ekspresi otomatis</button><button id="pause" type="button" aria-pressed="false">Jeda gerak</button></div>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
</main>
<script>
(function (global) {
  'use strict';
  const P = { light:'#D8C5F0', lilac:'#B99BDF', shade:'#9873C4', deep:'#8057AE', belly:'#FFF0DE', bellyShade:'#E8CDBF', peach:'#F4A08D', peachLight:'#FFD1B6', plum:'#41274F', iris:'#24152F' };
  const STATES = {
    ready: ['Siap latihan', 'Hai! Kita latihan ngobrol, yuk.'],
    listening: ['Mendengarkan', 'Aku mendengarkan. Sekarang giliranmu.'],
    speaking: ['Berbicara', 'Giliran Mimo mencontohkan pengucapannya.'],
    thinking: ['Berpikir', 'Sebentar, aku siapkan masukan untukmu.'],
    encourage: ['Coba lagi', 'Pelan-pelan saja. Aku temani kamu mencoba lagi.'],
    success: ['Berhasil', 'Yeay! Satu langkah lagi makin percaya diri.']
  };
  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
  function pose(state,t) {
    const p = { lift:Math.sin(t*1.7)*1.5, lean:Math.sin(t*.85)*.012, head:Math.sin(t*1.1)*.014, breath:Math.sin(t*1.7)*.012,
      right:-.28+Math.sin(t*1.3)*.035, left:-.27+Math.sin(t*1.3+.7)*.03, tail:Math.sin(t*1.45)*.065,
      mouth:.08, smile:1, round:0, joy:0, wink:0, gazeX:0, gazeY:0, brows:0, gills:.035,
      listen:0, speak:0, think:0, celebrate:0 };
    if(state==='ready'){p.right=-2.34+Math.sin(t*3.4)*.19;p.head=Math.sin(t*1.2)*.022;p.mouth=.18;}
    if(state==='listening'){p.head=-.105+Math.sin(t*1.8)*.022;p.lean=-.015;p.gazeX=-2;p.brows=.18;p.listen=1;p.gills=.055;p.right=-.43;}
    if(state==='speaking'){
      const syllable=(Math.sin(t*12)+.43*Math.sin(t*19+.8)+.22*Math.sin(t*7+1.3))/1.65;
      p.mouth=.22+.65*(syllable*.5+.5);p.round=.45+.32*Math.sin(t*6.5);p.speak=1;
      p.right=-1.03+Math.sin(t*2.2)*.22;p.left=-.48+Math.sin(t*1.8+.4)*.10;p.head=Math.sin(t*2)*.025;p.gills=.06;
    }
    if(state==='thinking'){p.head=.07;p.right=-2.78+Math.sin(t*1.1)*.025;p.left=-.32;p.gazeX=4;p.gazeY=-5;p.brows=.65;p.think=1;p.tail=Math.sin(t*.9)*.035;}
    if(state==='encourage'){p.head=-.035+Math.sin(t*2)*.028;p.right=-1.45+Math.sin(t*2.1)*.12;p.left=-.8;p.wink=.85*Math.exp(-Math.pow((t%5-1.6)/.22,2));p.mouth=.15;}
    if(state==='success'){const b=.5-.5*Math.cos(t*3.7);p.lift=-b*12;p.breath=.018*Math.sin(t*3.7);p.right=-2.45+Math.sin(t*3.7)*.12;p.left=-2.40+Math.sin(t*3.7+.3)*.12;p.joy=1;p.mouth=.72;p.celebrate=1;p.gills=.08;p.tail=Math.sin(t*2.2)*.10;}
    return p;
  }
  function create(canvas, options={}) {
    const c=canvas.getContext('2d');
    if(!c)throw new Error('Canvas 2D is unavailable');
    let current=null;
    function oval(x,y,rx,ry,fill) { c.fillStyle=fill;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill(); }
    function path(fill,draw) { c.beginPath();draw();c.fillStyle=fill;c.fill(); }
    function line(color,width,draw) { c.beginPath();draw();c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke(); }
    function linear(x0,y0,x1,y1,stops) {const g=c.createLinearGradient(x0,y0,x1,y1);for(const [at,color]of stops)g.addColorStop(at,color);return g;}
    function radial(x,y,r,stops) {const g=c.createRadialGradient(x,y,0,x,y,r);for(const [at,color]of stops)g.addColorStop(at,color);return g;}
    function glowOval(x,y,rx,ry,color) {c.save();c.translate(x,y);c.scale(rx,ry);oval(0,0,1,1,radial(0,0,1,[[0,color],[1,'rgba(255,240,230,0)']]));c.restore();}
    function tail(t,p) {
      c.save();c.translate(-36,42);c.rotate(p.tail);
      const fin=linear(-160,-100,-30,60,[[0,'#EEE0FA'],[.45,'#D1B9EE'],[1,'#A383CC']]);
      path(fin,()=>{c.moveTo(12,-3);c.bezierCurveTo(-58,6,-73,-71,-153,-95);c.bezierCurveTo(-184,-105,-193,-91,-204,-87);c.bezierCurveTo(-168,-75,-151,-53,-158,-21);c.bezierCurveTo(-181,23,-119,65,-56,43);c.bezierCurveTo(-20,36,3,31,12,18);c.closePath();});
      path(linear(-155,-80,-20,50,[[0,'#D3BDEE'],[.5,'#B99CDF'],[1,'#9270B9']]),()=>{c.moveTo(12,4);c.bezierCurveTo(-51,20,-95,15,-111,-23);c.bezierCurveTo(-124,-51,-152,-76,-189,-87);c.bezierCurveTo(-141,-75,-130,-36,-125,-6);c.bezierCurveTo(-120,35,-58,58,12,23);c.closePath();});
      line('rgba(255,255,255,.28)',1.8,()=>{c.moveTo(-175,-87);c.bezierCurveTo(-119,-62,-96,-10,-80,18);});
      line('rgba(255,255,255,.14)',1.2,()=>{c.moveTo(-176,-87);c.bezierCurveTo(-133,-70,-119,-50,-115,-25);});
      c.restore();
    }
    function foot(side,p) {
      c.save();c.translate(side*32,79);c.rotate(side*.055-p.lean*.4);
      oval(0,-2,24,28,linear(-17,-22,20,27,[[0,P.light],[.6,P.lilac],[1,P.shade]]));
      path(linear(-17,-6,13,30,[[0,'#CBB0EA'],[1,'#A584CD']]),()=>{c.moveTo(-23,8);c.bezierCurveTo(-27,24,-23,29,-10,30);c.bezierCurveTo(2,33,26,32,28,22);c.bezierCurveTo(30,10,18,5,9,3);c.bezierCurveTo(-7,-4,-18,-1,-23,8);});
      line('rgba(111,70,149,.23)',1.3,()=>{c.moveTo(-5,21);c.quadraticCurveTo(-6,25,-5,29);});
      line('rgba(111,70,149,.18)',1.3,()=>{c.moveTo(9,22);c.quadraticCurveTo(8,26,9,30);});c.restore();
    }
    function body(p,t) {
      c.save();c.scale(1.06+p.breath*.55,.98+p.breath);
      path(linear(-62,-58,64,85,[[0,'#DAC5F0'],[.45,'#BFA1E1'],[1,'#A07CC9']]),()=>{c.moveTo(0,-78);c.bezierCurveTo(51,-78,67,-27,71,23);c.bezierCurveTo(78,77,44,91,0,91);c.bezierCurveTo(-44,91,-78,77,-71,23);c.bezierCurveTo(-67,-27,-51,-78,0,-78);});
      path(linear(-25,-45,37,80,[[0,'#FFF6E6'],[.65,'#FAE5D1'],[1,'#E9CBBE']]),()=>{c.moveTo(0,-59);c.bezierCurveTo(33,-62,48,-15,49,30);c.bezierCurveTo(52,70,28,83,0,83);c.bezierCurveTo(-28,83,-52,70,-49,30);c.bezierCurveTo(-48,-15,-33,-62,0,-59);});
      glowOval(-15,-18,33,48,'rgba(255,255,255,.19)');c.restore();
    }
    function arm(side,angle) {
      c.save();c.translate(side*53,-29);c.scale(side,1);c.rotate(angle);
      path(linear(-17,10,23,74,[[0,'#D3B9EE'],[.5,'#BCA0E1'],[1,'#A780CB']]),()=>{c.moveTo(-15,-9);c.bezierCurveTo(-28,7,-21,37,-18,54);c.bezierCurveTo(-22,68,-13,82,-2,82);c.bezierCurveTo(6,84,14,79,17,71);c.bezierCurveTo(31,68,29,53,19,49);c.bezierCurveTo(20,29,22,8,12,-5);c.bezierCurveTo(5,-14,-8,-15,-15,-9);});
      glowOval(-7,60,13,17,'rgba(242,226,255,.27)');
      line('rgba(111,70,149,.17)',1.3,()=>{c.moveTo(-9,71);c.quadraticCurveTo(-8,75,-5,78);});
      line('rgba(111,70,149,.16)',1.3,()=>{c.moveTo(0,72);c.quadraticCurveTo(0,76,3,79);});c.restore();
    }
    function gill(side,i,t,p) {
      const y=[-35,3,40][i],angle=[-.70,-.02,.52][i],length=[55,69,54][i];
      c.save();c.translate(side*95,y);c.scale(side,1);c.rotate(angle+Math.sin(t*2.25-i*.65+side*.22)*p.gills);
      path(linear(3,17,length,-15,[[0,'#DD807C'],[.32,P.peach],[1,P.peachLight]]),()=>{c.moveTo(-10,-12);c.bezierCurveTo(13,-13,length-19,-30,length-3,-17);c.bezierCurveTo(length+15,-3,length+6,18,length-12,19);c.bezierCurveTo(25,21,13,8,-10,13);c.closePath();});
      glowOval(length-12,-7,19,11,'rgba(255,236,213,.34)');c.restore();
    }
    function eye(x,y,side,p,blink) {
      const joy=clamp(p.joy),closed=clamp(Math.max(blink,side===1?p.wink:0,joy));
      const openness=1-closed;
      c.save();c.translate(x,y);c.scale(1,Math.max(.035,openness));
      c.globalAlpha=clamp(openness*6);
      oval(0,0,20,25,'#FFF8F5');
      c.save();c.beginPath();c.ellipse(0,0,20,25,0,0,Math.PI*2);c.clip();
      const eyeX=p.gazeX+side*1.5,eyeY=p.gazeY+2;
      oval(eyeX,eyeY,15.7,22,linear(-3,-18,13,23,[[0,'#24152F'],[.5,'#41234B'],[1,'#75446E']]));
      oval(eyeX+1,eyeY-1,10,17,P.iris);
      oval(eyeX-5,eyeY-9,5.8,7,'rgba(255,255,255,.95)');
      oval(eyeX+7,eyeY+8,2.5,3,'rgba(255,236,245,.65)');c.restore();
      c.globalAlpha=openness*.35;line('#775293',1.5,()=>{c.moveTo(-17,-12);c.quadraticCurveTo(-1,-29,16,-13);});
      c.restore();
      c.save();c.globalAlpha=clamp((closed-.45)/.5);line(P.plum,4.8,()=>{c.moveTo(x-13,y+2);c.quadraticCurveTo(x,y-(joy*8+2),x+13,y+2);});c.restore();
    }
    function mouth(p) {
      const v=clamp(p.mouth),w=14+v*7-p.round*3,h=2+v*26,openAlpha=clamp((v-.06)/.18);
      c.save();c.translate(0,43);
      c.globalAlpha=openAlpha;
      path(P.plum,()=>{c.moveTo(-w,0);c.quadraticCurveTo(0,10-v*10, w,0);c.bezierCurveTo(w+3,h*.65,w*.4,h+5,0,h+5);c.bezierCurveTo(-w*.4,h+5,-w-3,h*.65,-w,0);});
      c.save();c.clip();oval(0,h+7,13,7,P.peachLight);c.restore();
      // Blend a quiet closed smile into an open mouth without a hard shape switch.
      c.globalAlpha=1-openAlpha;
      line(P.plum,3.8,()=>{c.moveTo(-13,1);c.quadraticCurveTo(0,14,13,1);});c.restore();
    }
    function head(p,t) {
      c.save();c.translate(-2,-144);c.rotate(p.head);c.scale(1.08,.88);
      for(const side of [-1,1])for(let i=0;i<3;i++)gill(side,i,t,p);
      path(linear(-65,-86,80,91,[[0,'#E1CEF4'],[.32,'#CDB2EB'],[.75,'#B798DE'],[1,'#A886D1']]),()=>{c.moveTo(-2,-101);c.bezierCurveTo(71,-104,109,-59,114,9);c.bezierCurveTo(126,61,113,83,76,89);c.bezierCurveTo(29,99,-34,97,-79,86);c.bezierCurveTo(-118,77,-123,58,-113,9);c.bezierCurveTo(-108,-56,-73,-99,-2,-101);});
      glowOval(-34,-62,69,42,'rgba(255,255,255,.20)');
      glowOval(0,67,108,48,'rgba(255,234,219,.54)');
      glowOval(-73,45,27,20,'rgba(242,152,145,.46)');
      glowOval(73,45,27,20,'rgba(242,152,145,.46)');
      const phase=t%5.25,blink=Math.exp(-Math.pow((phase-4.0)/.073,2));
      eye(-45,13,-1,p,blink);eye(45,13,1,p,blink);
      line('#8C669F',3.8,()=>{c.moveTo(-57,-26-p.brows*8);c.quadraticCurveTo(-47,-34-p.brows*7,-37,-28-p.brows*2);});
      line('#8C669F',3.8,()=>{c.moveTo(35,-28+p.brows*3);c.quadraticCurveTo(46,-34+p.brows*3,56,-26);});
      mouth(p);c.restore();
    }
    function star(x,y,r,a,rot=0) {c.save();c.translate(x,y);c.rotate(rot);c.globalAlpha=clamp(a);path(P.peach,()=>{c.moveTo(0,-r);c.quadraticCurveTo(r*.2,-r*.2,r,0);c.quadraticCurveTo(r*.2,r*.2,0,r);c.quadraticCurveTo(-r*.2,r*.2,-r,0);c.quadraticCurveTo(-r*.2,-r*.2,0,-r);});c.restore();}
    function render(t,state='ready',dt=1/60,immediate=false) {
      if(!STATES[state])state='ready';
      const target=pose(state,t),alpha=1-Math.exp(-Math.max(0,dt)/.16);
      if(!current||immediate)current={...target};else for(const k of Object.keys(target))current[k]+=(target[k]-current[k])*alpha;
      const p=current;
      const sx=canvas.width/600,sy=canvas.height/500;c.setTransform(sx,0,0,sy,0,0);c.clearRect(0,0,600,500);
      if(options.background){c.fillStyle=options.background;c.fillRect(0,0,600,500);}
      c.save();c.translate(300,449);c.scale(1+p.lift*.005,.16);oval(0,0,106,106,radial(0,0,106,[[0,'rgba(67,36,87,.16)'],[.6,'rgba(67,36,87,.06)'],[1,'rgba(67,36,87,0)']]));c.restore();
      c.save();c.translate(300,340+p.lift);c.rotate(p.lean);
      tail(t,p);foot(-1,p);foot(1,p);body(p,t);arm(-1,p.left);arm(1,p.right);head(p,t);c.restore();
      if(p.listen>.005){c.save();c.globalAlpha=p.listen*(.45+.18*Math.sin(t*2));line(P.peach,3.5,()=>{c.moveTo(112,173);c.quadraticCurveTo(100,186,112,199);});line(P.peach,3.5,()=>{c.moveTo(99,165);c.quadraticCurveTo(79,186,99,207);});c.restore();}
      if(p.speak>.005){c.save();c.globalAlpha=p.speak;for(let i=0;i<4;i++){const h=8+(Math.sin(t*9-i*.8)*.5+.5)*21;line(P.peach,4,()=>{c.moveTo(483+i*10,211-h/2);c.lineTo(483+i*10,211+h/2);});}c.restore();}
      if(p.think>.005){c.save();for(let i=0;i<3;i++){c.globalAlpha=p.think*(.25+.55*(Math.sin(t*2.7-i*.75)*.5+.5));oval(414+i*16,99,3.5,3.5,P.lilac);}c.restore();}
      if(p.celebrate>.005){star(121,110,9+Math.sin(t*2)*2,p.celebrate*.8,t*.14);star(469,86,12+Math.sin(t*2+.7)*2,p.celebrate*.9,-t*.2);star(451,343,8+Math.sin(t*2+1.4)*2,p.celebrate*.7,t*.1);}
      return {...p};
    }
    return {render,states:STATES};
  }
  global.MimoFullBody={create,states:STATES};
  if(typeof module==='object'&&module.exports)module.exports=global.MimoFullBody;
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<script>
(() => {
  const canvas=document.getElementById('mimo'),renderer=MimoFullBody.create(canvas),states=MimoFullBody.states,order=Object.keys(states);
  const title=document.getElementById('state-title'),line=document.getElementById('state-line'),buttons=[...document.querySelectorAll('[data-state]')];
  const autoButton=document.getElementById('auto'),pauseButton=document.getElementById('pause'),progress=document.getElementById('progress');
  const media=window.matchMedia('(prefers-reduced-motion: reduce)');
  let state='ready',auto=!media.matches,paused=media.matches,clock=0,stateClock=0,last=performance.now(),force=false;
  function labels(){title.textContent=states[state][0];line.textContent=states[state][1];buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));autoButton.setAttribute('aria-pressed',String(auto));pauseButton.setAttribute('aria-pressed',String(paused));pauseButton.textContent=paused?'Lanjutkan gerak':'Jeda gerak';canvas.setAttribute('aria-label','Mimo full badan sedang '+states[state][0].toLowerCase()+'. '+states[state][1]);}
  function choose(next,manual=false){if(!states[next])return;state=next;stateClock=0;if(manual)auto=false;if(paused)force=true;labels();}
  buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.state,true)));
  autoButton.addEventListener('click',()=>{auto=!auto;stateClock=0;labels();});
  pauseButton.addEventListener('click',()=>{paused=!paused;last=performance.now();labels();});
  media.addEventListener('change',()=>{paused=media.matches;auto=!media.matches;force=true;labels();});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  function tick(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!document.hidden){if(!paused){clock+=dt;stateClock+=dt;if(auto&&stateClock>=6.4)choose(order[(order.indexOf(state)+1)%order.length]);renderer.render(clock,state,dt);}else if(force){renderer.render(clock,state,0,true);force=false;}progress.style.transform='scaleX('+(auto?Math.min(1,stateClock/6.4):0)+')';}requestAnimationFrame(tick);}
  labels();renderer.render(0,state,0,true);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
